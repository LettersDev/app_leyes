name: 🤖 Generar Pregunta Legal Diaria

on:
  # Ejecutar todos los días a las 8:00 AM hora Venezuela (UTC-4 = 12:00 UTC)
  schedule:
    - cron: '0 12 * * *'

  # Permite ejecutarlo manualmente desde GitHub Actions UI (para pruebas)
  workflow_dispatch:

jobs:
  generate-daily-quiz:
    name: Generar Quiz del Día
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📋 Llamar Edge Function generate-daily-quiz
        run: |
          RESPONSE=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -X POST \
            "${{ secrets.SUPABASE_URL }}/functions/v1/generate-daily-quiz" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{}')

          echo "HTTP Status: $RESPONSE"
          echo "Response body:"
          cat /tmp/response.json

          # Falla si el status HTTP no es 2xx
          if [[ "$RESPONSE" -lt 200 || "$RESPONSE" -ge 300 ]]; then
            echo "❌ Error: la Edge Function devolvió HTTP $RESPONSE"
            exit 1
          fi

          # Verifica que la respuesta tenga ok: true
          OK=$(cat /tmp/response.json | python3 -c "import sys, json; d=json.load(sys.stdin); print(d.get('ok', False))")
          if [[ "$OK" != "True" ]]; then
            echo "⚠️  La función respondió pero con ok=false"
            cat /tmp/response.json
            # No falla — puede ser que el quiz ya existía para hoy
          else
            echo "✅ Quiz generado correctamente"
            cat /tmp/response.json
          fi
